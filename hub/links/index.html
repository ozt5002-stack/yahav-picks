<style>
:root{--cream:#FAF6F1;--blush:#E9CECE;--bordeaux:#743F4A;--bordeaux-deep:#5E313B;--teal:#9CCBC4;--ink:#292426;--muted:#665A5D;--white:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--blush);color:var(--ink);font-family:"Assistant","Heebo","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.5;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:440px;margin-inline:auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start;text-align:center}
img{display:block;margin-inline:auto;width:112px;height:112px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid var(--white)}
h1{margin:0;font-family:"Bellefair",Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;color:var(--bordeaux-deep)}
.sub{margin:4px 0 0}
.buttons{display:grid;gap:12px;margin-top:6px}
.btn{display:grid;gap:2px;text-decoration:none;border-radius:20px;padding:16px 20px;font-weight:800;font-size:19px}
.btn small{font-weight:400;font-size:14px}
.btn.main{background:var(--bordeaux);color:var(--white)}
.btn.main:hover{background:var(--bordeaux-deep)}
.btn.picks{background:var(--white);color:var(--bordeaux-deep)}
.btn.picks small{color:var(--ink)}
.social{display:flex;justify-content:center;gap:18px;font-size:15px}
.social a{color:var(--bordeaux-deep)}
footer{text-align:center;font-size:13px;padding:0 16px 24px}
footer a{color:var(--ink)}
:focus-visible{outline:3px solid var(--bordeaux-deep);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<main>

    <a href="https://wa.me/972585637393">וואטסאפ</a>
  </p>
