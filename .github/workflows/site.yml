# Rebuilds the site from Airtable and publishes it to GitHub Pages.
# - Every hour: checks Airtable, publishes only if something visible changed.
# - "Run workflow" button (Actions tab) or a push to main: always publishes.
# - An outside pinger can call workflow_dispatch with force=false to check more often
#   than GitHub's schedule, which can lag by hours.
name: Site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing changed in Airtable
        type: boolean
        default: true
  push:
    branches: [main]

# Least privilege (OWASP A01/A08): nothing by default; each job asks only for what it needs. The build job runs
# npm packages with the Airtable token, so it can read the repo but not write to it or publish.
# Actions are pinned to a commit, not a tag: a tag can be moved to other code, a commit cannot.
permissions: {}

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore photo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      - name: Build
        id: build
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::warning::AIRTABLE_TOKEN secret is not set yet, skipping."
            exit 0
          fi
          npm run build

      - name: Decide whether to publish
        id: decide
        run: |
          new="${{ steps.build.outputs.hash }}"
          old="$(cat data/last-hash.txt 2>/dev/null || true)"
          if [ -z "$new" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ] || [ "$new" != "$old" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in Airtable."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # required by deploy-pages
      contents: write   # commit data/last-hash.txt
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Remember what was published. The commit also keeps the repo active,
      # so GitHub does not pause the hourly schedule after 60 quiet days.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Save data fingerprint
        run: |
          mkdir -p data
          echo "${{ needs.build.outputs.hash }}" > data/last-hash.txt
          if git diff --quiet -- data/last-hash.txt; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-hash.txt
          git commit -m "Record published data fingerprint"
          git push
